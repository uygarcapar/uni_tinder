name: E2E · iOS

# macOS runner'lar DAKİKA BAŞINA 10× faturalanıyor (Linux 1×). Bu yüzden
# e2e HER PR'da KOŞMUYOR:
#   • Her PR  → ci.yml içindeki ücretsiz `e2e:type-check` (Linux)
#   • `e2e` etiketi / e2e+auth dosyaları değişti → smoke + auth (~12 dk)
#   • Nightly → tam suite
#   • Elle    → workflow_dispatch (suite + seed + cihaz girdili)
on:
  schedule:
    # 00:00 UTC = 03:00 TR
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'smoke | auth | core | full | monkey'
        default: 'smoke'
      seed:
        description: 'E2E_SEED (boş = rastgele, loglanır)'
        default: ''
      device:
        description: 'Simülatör adı'
        default: 'iPhone 17 Pro'
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'e2e/**'
      - 'src/features/auth/**'
      - 'src/navigation/**'

concurrency:
  # Tek simülatör, tek backend: paralel koşular birbirinin hesaplarını ve
  # `simctl` profilini ezer.
  group: e2e-ios
  cancel-in-progress: false

jobs:
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    name: E2E (${{ inputs.suite || 'auto' }})
    runs-on: macos-15
    timeout-minutes: 150
    env:
      E2E_SUITE: ${{ inputs.suite || (github.event_name == 'pull_request' && 'auth' || 'full') }}
      E2E_SEED: ${{ inputs.seed }}
      E2E_DEVICE: ${{ inputs.device || 'iPhone 17 Pro' }}
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Gizli: EXPO_PUBLIC_API_BASE_URL + E2E_UDID + koordinatlar.
      # ⚠️ RevenueCat anahtarı BİLEREK BOŞ — satın alma akışı sessizce kapanıyor,
      # paywall sheet'leri yine açılıyor ve test edilebiliyor.
      - name: .env.e2e yaz
        run: printf '%s' "${{ secrets.E2E_ENV_FILE }}" > e2e/.env.e2e

      # ── Cache: en pahalı üç kalem ──────────────────────────────────────────
      - name: Pods cache
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('package-lock.json', 'app.json', 'patches/**') }}

      - name: App build cache
        uses: actions/cache@v4
        with:
          path: e2e/.artifacts/build
          # Debug build'de JS Metro'dan geliyor ama app.json / plugin / patch
          # değişimi binary'yi etkiliyor.
          key: app-${{ hashFiles('app.json', 'package-lock.json', 'patches/**', 'plugins/**') }}

      - name: WebDriverAgent cache
        uses: actions/cache@v4
        with:
          path: e2e/.artifacts/wda-dd
          key: wda-${{ hashFiles('package-lock.json') }}-xcode26.1

      - name: Fixtures
        run: npm run e2e:fixtures

      # Driver ayrıca kurulmuyor: Appium node_modules'ı kendisi tarıyor.
      - name: Backend ön koşulları + xcuitest doğrulaması
        run: npm run e2e:setup

      - name: Prebuild (ios/ git-ignored)
        run: npm run e2e:prebuild

      - name: Build (Debug · iphonesimulator)
        run: npm run e2e:build

      # SIRA KRİTİK: boot → bootstatus → privacy → location → addmedia.
      # `privacy`/`location`, SpringBoard ayakta değilken sessizce etkisiz.
      - name: Simülatörü hazırla
        run: npm run e2e:boot

      # `--clear` şart: EXPO_PUBLIC_* bundle'a gömülüyor ve cache'leniyor.
      # İlk bundle TESTİN İÇİNDE değil burada ödeniyor.
      - name: Metro (arka plan, bundle ön-ısıtmalı)
        run: npm run e2e:metro &

      - name: Botları tohumla
        run: npm run e2e:seed -- --bots ${{ vars.E2E_BOT_COUNT || 6 }}

      - name: E2E
        run: npm run e2e

      # if: always() — başarısız koşu backend'de hesap BIRAKMAMALI.
      - name: Temizlik
        if: always()
        run: npm run e2e:seed -- --purge --run "$E2E_RUN_ID"

      - name: Allure geçmişi (trend)
        if: always()
        uses: actions/cache@v4
        with:
          path: e2e/.artifacts/allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Artefaktlar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            e2e/.artifacts/video/**
            e2e/.artifacts/shots/**
            e2e/.artifacts/logs/**
            e2e/.artifacts/appium/**
            e2e/.artifacts/trees/**
            e2e/.artifacts/monkey/**
            e2e/.artifacts/allure/**
            e2e/.artifacts/junit/**
            e2e/.artifacts/seed-report.json
            e2e/.artifacts/run.json

      - name: Test özeti
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E iOS
          path: 'e2e/.artifacts/junit/*.xml'
          reporter: java-junit
          fail-on-error: false
